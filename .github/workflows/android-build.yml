name: Android build

# Compiles the Kotlin/Android app so the module is validated on every push/PR.
# The Gradle wrapper JAR is not checked in, so CI provisions Gradle directly
# (gradle/actions/setup-gradle with an explicit gradle-version).

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # assembleDebug compiles all Kotlin and produces a debug APK. lint adds a
      # static check pass. --no-daemon is the CI-friendly default.
      - name: Compile (assembleDebug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
