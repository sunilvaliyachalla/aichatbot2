name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web-e2e:
    # Playwright end-to-end: drives Chromium with fake camera/mic and runs a
    # real two-peer WebRTC call through the signaling server. The webServer
    # config in playwright.config.ts starts both the signaling + web servers.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The signaling server is launched by Playwright's webServer, so its deps
      # must be installed too.
      - name: Install web deps
        run: npm ci
      - name: Install signaling-server deps
        working-directory: server
        run: npm ci
      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  ai-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Tests mock ASR and the LLM, so install only the lightweight runtime +
      # pytest (skip the heavy faster-whisper download).
      - run: pip install fastapi==0.111.0 "uvicorn[standard]==0.30.1" httpx==0.27.0 python-multipart==0.0.9 anyio==4.4.0 pytest==8.2.2
      - run: pytest -q
