org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---- App configuration (overridable per-machine in local.properties) ----
# Signaling server URL. Use 10.0.2.2 to reach the host machine from the
# Android emulator. For a physical device on the same LAN, use the host IP.
SIGNALING_URL=http://10.0.2.2:4000

# Comma-separated STUN servers.
STUN_URLS=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302

# Optional TURN. Leave blank to disable.
TURN_URL=
TURN_USERNAME=
TURN_CREDENTIAL=

# AI side-channel server (FastAPI). 10.0.2.2 = host from the emulator.
# ws:// for live captions is derived from this automatically. Leave blank to
# hide AI features in the UI.
AI_SERVER_URL=http://10.0.2.2:8000
